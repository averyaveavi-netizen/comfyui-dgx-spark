# ============================================================================
# (Optionnel) Reverse proxy HTTP pour exposer ComfyUI sur le LAN, port 8080.
#
# ComfyUI écoute sur 127.0.0.1:8188 (voir compose.yaml). Ce vhost le proxifie.
# Installe-le dans le contexte http de nginx (le bloc `map` doit y être valide) :
#     sudo cp nginx/comfyui.conf /etc/nginx/conf.d/comfyui.conf
#     sudo nginx -t && sudo systemctl reload nginx
# Accès :  http://<IP-de-l-hote>:8080/
#
# ⚠️ SÉCURITÉ : ComfyUI n'a AUCUNE authentification. N'expose ce proxy que sur
#    un réseau de confiance (LAN privé), jamais sur Internet sans auth devant.
# ============================================================================

# WebSocket : ComfyUI pousse la progression des générations en direct.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # Upload d'images/modèles + génération lourde : aucune limite de taille.
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8188;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Générations longues : pas de buffering, timeouts larges.
        proxy_buffering     off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
